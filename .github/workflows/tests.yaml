name: Tests
on:
  pull_request:
  push:

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container-image:
          - "ghcr.io/dlang-dockerized/dmd:latest"
          - "ghcr.io/dlang-dockerized/ldc:latest"
          - "ghcr.io/dlang-dockerized/ldc:ltsmaster-trixie"

    steps:
      - uses: actions/checkout@v7

      - name: Run build script in container
        run: |
          podman run \
            --init \
            -v '.':'/opt/mindybuild' \
            -w /opt/mindybuild \
            ${{ matrix.container-image }} \
            ./build.sh \
            && \
              ./bin/mindybuild --help

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container-image:
          - "ghcr.io/dlang-dockerized/dmd:latest"
          - "ghcr.io/dlang-dockerized/ldc:latest"

    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: |
          podman run \
              --init \
              -v '.':'/opt/mindybuild' \
              -w /opt/mindybuild \
              ${{ matrix.container-image }} \
            ./test.sh
